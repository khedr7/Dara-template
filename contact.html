    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/fontawesome.min.css" />

    <link rel="stylesheet" href="css/slick.css" />

  <body>
    <div data-include="partials/preloader.html"></div>
    <div data-include="partials/header.html"></div>

    <div data-include="partials/page-header.html" data-page-title="اتصل بنا | Contact Us" data-page-breadcrumb="اتصل بنا | Contact" data-page-bg="images/section-bg/page-header.jpg" data-page-overlay="rgba(6, 6, 6, 0.7)"></div></div>

    <div
      class="contact-info-area style-1 te-py-120"
      style="background-color: #1a1a1a !important"
    >
      <div class="container">
        <div class="row">
          <div class="col-lg-4 col-md-6">
            <div class="te-icon-card style-1">
              <div class="te-icon">
                <i class="fa-solid fa-location-dot"></i>
              </div>
              <div class="content">
                <h3 class="title" style="color: #ffffff !important">
                  الموقع | Location
                </h3>
                <span class="desc" style="color: #ffffff !important"
                  >Damascus, Syria<br />دمشق، سوريا</span
                >
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6">
            <div class="te-icon-card style-1">
              <div class="te-icon">
                <i class="fa-solid fa-phone"></i>
              </div>
              <div class="content">
                <h3 class="title" style="color: #ffffff !important">
                  اتصل بنا | Call Us
                </h3>
                <a
                  href="tel:+963-XXX-XXXX"
                  class="desc"
                  style="color: #ffffff !important"
                  >+963-XXX-XXXX</a
                >
                <br />
                <a
                  href="tel:+963-XXX-XXXX"
                  class="desc"
                  style="color: #ffffff !important"
                  >+963-XXX-XXXX</a
                >
              </div>
            </div>
          </div>
          <div class="col-lg-4 col-md-6">
            <div class="te-icon-card style-1">
              <div class="te-icon">
                <i class="fa-solid fa-envelope"></i>
              </div>
              <div class="content">
                <h3 class="title" style="color: #ffffff !important">
                  البريد الإلكتروني | E-Mail
                </h3>
                <a
                  href="mailto:info@daragroup.com"
                  class="desc"
                  style="color: #ffffff !important"
                  >info@daragroup.com</a
                >
                <br />
                <a
                  href="mailto:support@daragroup.com"
                  class="desc"
                  style="color: #ffffff !important"
                  >support@daragroup.com</a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Contact Form Section Start -->
    <div class="appointment-area style-1 te-py-120">
      <div class="container">
        <div class="row gy-5">
          <div
            class="col-xl-6 wow fadeInLeft"
            data-wow-delay="100ms"
            data-wow-duration="1500ms"
          >
            <div class="about-image-card">
              <div class="image-one">
                <img src="images/about/about-img-one.jpg" alt="Construction" />
              </div>
              <div class="image-two">
                <img src="images/about/about-img-two.jpg" alt="Development" />
                <div class="image-three">
                  <img
                    src="images/about/about-img-three.png"
                    alt="Infrastructure"
                  />
                </div>
                <div class="shape-image">
                  <img src="images/about/shape-three.png" alt="shape" />
                </div>
              </div>
            </div>
          </div>
          <div
            class="col-xl-6 wow fadeInRight"
            data-wow-delay="200ms"
            data-wow-duration="1500ms"
          >
            <div class="te-post-comments-form style-2 mt-0">
              <div class="comment-respond">
                <div class="te-section-title">
                  <div class="te-section-content">
                    <div class="short-title-wrapper">
                      <span class="short-title only-divider"
                        >تواصل معنا | Contact Us</span
                      >
                    </div>
                    <h2 class="title">هل لديك أي استفسار؟</h2>
                    <div class="te-section-desc">
                      <p class="text-white">
                        نحن هنا للإجابة على جميع استفساراتكم ومساعدتكم في تحقيق
                        مشاريعكم. تواصلوا معنا اليوم!
                      </p>
                    </div>
                  </div>
                </div>
                <form action="#" method="post" class="comment-form">
                  <div class="row gx-4">
                    <div class="col-xl-6">
                      <div class="te-contacts-email">
                        <input
                          name="name"
                          type="text"
                          placeholder="الاسم | Your Name*"
                          required
                        />
                      </div>
                    </div>
                    <div class="col-xl-6">
                      <div class="te-contacts-email">
                        <input
                          name="email"
                          type="email"
                          placeholder="البريد الإلكتروني | Your Email*"
                          required
                        />
                      </div>
                    </div>
                    <div class="col-xl-6">
                      <div class="te-contacts-name">
                        <input
                          name="phone"
                          type="tel"
                          placeholder="رقم الهاتف | Your Phone"
                        />
                      </div>
                    </div>
                    <div class="col-xl-6">
                      <div class="te-contacts-name">
                        <input
                          name="subject"
                          type="text"
                          placeholder="الموضوع | Subject"
                        />
                      </div>
                    </div>
                    <div class="col-xl-12">
                      <div class="te-contacts-message">
                        <textarea
                          name="message"
                          cols="20"
                          rows="5"
                          placeholder="الرسالة | Your Message*"
                          required
                        ></textarea>
                      </div>
                    </div>
                    <div class="col-12">
                      <button class="te-theme-btn" type="submit">
                        إرسال الرسالة | Send Message
                        <i class="fa-solid fa-arrow-right"></i>
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- Contact Form Section End -->

    <div data-include="partials/footer.html"></div>
    <div data-include="partials/scroll-top.html"></div>
    <script src="js/bundle.js"></script>
  </body>
</html>
